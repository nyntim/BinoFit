<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress 30D, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1900px; background: #0e0e10;">
  <dc-import name="Main" dark="{{yes}}" range="30d" hint-size="390px,1900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
