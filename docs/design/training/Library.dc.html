<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.bf{--background:#f8f5ef;--card:#eeeae2;--card2:#e4e0d6;--text:#1a1a22;--icon:#606070;--sep:#d6d2c8;--field:#d6d2c8;--tint:#3d4b7a;--on-tint:#f8f5ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--background);font-variant-numeric:tabular-nums}
.bf.dark{--background:#0e0e10;--card:#1a1a1d;--card2:#242428;--text:#ededf0;--icon:#8e8e96;--sep:rgba(237,237,240,0.10);--field:rgba(237,237,240,0.28);--tint:#8fa3d6;--on-tint:#0e0e10}
.bf button{font:inherit;cursor:pointer}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--tint)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{flex-shrink:0;font-size:13px;font-weight:500;border-radius:20px;padding:6px 14px;background:var(--card2);color:var(--icon);border:0}
.chip.on{background:var(--tint);color:var(--on-tint)}
.sec{font-size:12px;font-weight:500;color:var(--icon);letter-spacing:0.4px;text-transform:uppercase;margin:0;padding:0 4px}
.ex{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--text)}
.ex:last-child{border-bottom:0}
.tag{font-size:12px;font-weight:500;color:var(--icon);flex-shrink:0}
</style>
</helmet>
<div class="bf {{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">
  <header style="padding:52px 8px 4px 4px;display:flex;align-items:center;gap:4px">
    <button class="iconbtn" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 style="margin:0;flex-grow:1;font-size:22px;font-weight:700">Exercises</h1>
    <button style="background:var(--tint);color:var(--on-tint);border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600">+ New exercise</button>
  </header>

  <div style="padding:8px 16px 0;display:flex;flex-direction:column;gap:10px">
    <label style="display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:8px;padding:0 12px;height:44px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--icon)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Search exercises" value="{{query}}" placeholder="Search exercises" style="flex-grow:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:15px;outline:none">
    </label>
    <div style="display:flex;gap:8px;overflow:hidden">
      <button class="chip on">All</button><button class="chip">Chest</button><button class="chip">Back</button><button class="chip">Shoulders</button><button class="chip">Arms</button><button class="chip">Legs</button>
    </div>
  </div>

  <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
    <div style="padding:24px 16px;display:flex;flex-direction:column;gap:16px">
      <p style="margin:0;font-size:15px;color:var(--icon)">No exercises match “pec deck”.</p>
      <button style="display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:18px;padding:16px;text-align:left;color:var(--text)">
        <span style="width:40px;height:40px;border-radius:8px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;font-size:22px;font-weight:600;flex-shrink:0">+</span>
        <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600">Create “pec deck”</span><span style="font-size:13px;color:var(--icon)">Add the machine, its brand and your seat settings</span></span>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
    <div style="flex-grow:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:10px">
      <h2 class="sec">Your exercises</h2>
      <section style="background:var(--card);border-radius:18px;padding:4px 16px">
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px">Chest Press · Hammer Strength</span><span style="font-size:12px;color:var(--icon)">Chest, triceps · Seat 4, back pad 2</span></span><span class="tag">Machine</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px">Cable lateral raise</span><span style="font-size:12px;color:var(--icon)">Side delts · per side</span></span><span class="tag">Cable</span></button>
      </section>

      <h2 class="sec" style="margin-top:6px">All exercises</h2>
      <section style="background:var(--card);border-radius:18px;padding:4px 16px">
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Back squat</span><span style="font-size:12px;color:var(--icon)">Quads, glutes</span></span><span class="tag">Barbell</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Barbell bench press</span><span style="font-size:12px;color:var(--icon)">Chest, triceps</span></span><span class="tag">Barbell</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Barbell curl</span><span style="font-size:12px;color:var(--icon)">Biceps</span></span><span class="tag">Barbell</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Barbell row</span><span style="font-size:12px;color:var(--icon)">Upper back, lats</span></span><span class="tag">Barbell</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Bulgarian split squat</span><span style="font-size:12px;color:var(--icon)">Quads, glutes · per side</span></span><span class="tag">Dumbbell</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Cable crunch</span><span style="font-size:12px;color:var(--icon)">Abs</span></span><span class="tag">Cable</span></button>
        <button class="ex"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px">Chin-up</span><span style="font-size:12px;color:var(--icon)">Lats, biceps</span></span><span class="tag">Bodyweight</span></button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"noResults":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const noResults = !!this.props.noResults;
    return {
      themeClass: this.props.dark ? 'dark' : '',
      noResults,
      hasResults: !noResults,
      query: noResults ? 'pec deck' : ''
    };
  }
}
</script>
</body>
</html>
