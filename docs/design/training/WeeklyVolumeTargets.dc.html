<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weekly volume targets</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;display:flex;gap:24px;flex-wrap:wrap;background:#D6D2C8;font:15px -apple-system,BlinkMacSystemFont,sans-serif}.phone{width:390px;min-height:844px;padding:20px;background:var(--background);color:var(--text);--background:#F8F5EF;--card:#EEEAE2;--card2:#E4E0D6;--text:#1A1A22;--icon:#606070;--track:#D6D2C8;--tint:#3D4B7A;--success:#27AE60;border-radius:18px}.dark{--background:#0E0E10;--card:#1A1A1D;--card2:#242428;--text:#EDEDF0;--icon:#8E8E96;--track:rgba(237,237,240,.14);--tint:#8FA3D6}h1{font-size:22px;line-height:1.2;margin:8px 0 24px;font-weight:600}h2{font-size:17px;font-weight:600}p{line-height:1.5}button{min-height:44px;color:var(--tint);background:none;border:0;padding:8px 0;font:inherit;text-align:left}label{display:flex;align-items:center;gap:8px;margin:16px 0}label span{flex:1}input{width:64px;min-height:44px;background:var(--card2);color:var(--text);border:0;border-radius:8px;text-align:center;font:inherit}.card{margin-top:24px;background:var(--card);padding:20px;border-radius:18px}.head{display:flex;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;justify-content:space-between;gap:8px}.count{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}.track{height:8px;background:var(--track);border-radius:4px;margin:4px 0}.fill{height:100%;background:var(--text);border-radius:4px}.met{background:var(--success)}small{font-size:12px}
</style><body><script>
const form = `<button>Back</button><h1>Weekly volume targets</h1><p>Optional. Enter 1 to 40 sets. Leave blank or enter 0 to clear.</p><button>Use recommended</button><p>Editable starting values for six regions. Other regions stay optional.</p>${[['Chest','12'],['Shoulders','10'],['Triceps',''],['Biceps',''],['Forearms',''],['Lats','10'],['Traps',''],['Erectors',''],['Abdominals',''],['Glutes','10'],['Quads','10'],['Hamstrings','10'],['Adductors',''],['Calves','']].map(([r,v])=>`<label><span>${r}</span><input aria-label="${r} weekly sets" value="${v}">sets / week</label>`).join('')}<button>Save</button><br><button>Cancel</button>`;
const card = `<button>Back</button><h1>Training</h1><p>Oct 19 - 25</p><section class="card"><div class="head"><h2>Sets</h2><button>Edit targets</button></div><div class="grid">${[['Chest','8 / 12',67,'Under target'],['Lats','10 / 10',100,'Met'],['Quads','14 / 10',100,'Over target'],['Glutes','0 / 10',0,'Under target']].map(([r,c,w,s])=>`<div><div class="row"><span>${r}</span><span class="count">${c}</span></div><div class="track"><div class="fill ${s==='Met'?'met':''}" style="width:${w}%"></div></div><small>${s}</small></div>`).join('')}</div></section><p>Working sets this week. Warmups excluded.</p>`;
for(const dark of [false,true])for(const content of [form,card]){const el=document.createElement('main');el.className='phone'+(dark?' dark':'');el.innerHTML=content;document.body.appendChild(el)}
</script></html>
