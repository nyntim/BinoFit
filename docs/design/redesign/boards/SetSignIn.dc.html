<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="modal-under"></div>
  <div class="modal">
    <div class="modal-bar">
      <a href="SetIndex.dc.html" class="link start" style="font-weight: 400; text-decoration: none; display: inline-flex; align-items: center">Close</a>
      <span></span><span></span>
    </div>
    <div class="stack g18" style="padding: 8px 20px 0">
      <div class="stack g8">
        <h1 class="h-xl">Welcome back</h1>
        <p class="t-body muted" style="margin: 0">Sign in to restore your log. Anything you've logged on this phone is kept and merged.</p>
      </div>
      <div class="stack g14">
        <div class="stack g6"><label for="em" class="lbl">Email</label><input id="em" class="field" value="sam@example.com" type="email" autocomplete="email"></div>
        <div class="stack g6">
          <div class="between"><label for="pw" class="lbl">Password</label><button type="button" class="link" style="font-size: 13px; height: 32px; padding: 0">Forgot password?</button></div>
          <input id="pw" class="field error" value="••••••••" type="text" aria-invalid="true" aria-describedby="pw-err" autocomplete="current-password">
          <span id="pw-err" class="err"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>That email and password don't match.</span>
        </div>
      </div>
      <a href="OnbRestore.dc.html" class="btn btn-lg btn-primary">Sign in</a>
      <div class="hstack g12"><span class="sep grow"></span><span class="t-cap">or</span><span class="sep grow"></span></div>
      <button type="button" class="btn btn-lg btn-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"></path></svg>
        Sign in with Apple
      </button>
      <p class="t-label muted" style="margin: 4px 0 0; text-align: center">New here? <a href="OnbAccount.dc.html" class="tint semi" style="text-decoration: none">Create an account</a></p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent };
  }
}
</script>
</body>
</html>
