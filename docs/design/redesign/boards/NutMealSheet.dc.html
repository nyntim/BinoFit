<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meal targets and reminder</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll" aria-hidden="true">
    <h1 class="h-large">Edit meals</h1>
    <div class="card" style="height: 112px"></div>
    <div class="card" style="height: 112px"></div>
    <div class="card" style="height: 112px"></div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" role="dialog" aria-label="Breakfast targets and reminder">
    <div class="grabber"></div>
    <div class="between">
      <a href="NutEdit.dc.html" class="link" style="font-weight: 400; text-decoration: none; display: inline-flex; align-items: center">Cancel</a>
      <span class="t-title">Breakfast</span>
      <a href="NutEdit.dc.html" class="link" style="text-decoration: none; display: inline-flex; align-items: center">Save</a>
    </div>

    <div class="stack g8">
      <span class="sec">Targets for this meal</span>
      <div class="nested" style="overflow: hidden">
        <sc-for list="{{targets}}" as="t" hint-placeholder-count="4">
          <div class="hstack g12" style="min-height: 52px; padding: 6px 12px 6px 16px; border-top: {{t.border}}">
            <span class="dot" style="background: {{t.color}}"></span>
            <label for="{{t.id}}" class="grow t-body">{{t.label}}</label>
            <input id="{{t.id}}" class="field mini num" value="{{t.value}}" placeholder="None" style="background: var(--card)">
            <span class="t-label muted" style="width: 22px">{{t.unit}}</span>
          </div>
        </sc-for>
      </div>
      <span class="t-cap" style="padding: 0 4px">Leave a target blank to skip it. Meal targets show on the meal summary.</span>
    </div>

    <div class="stack g8">
      <span class="sec">Reminder</span>
      <div class="nested" style="overflow: hidden">
        <div class="hstack g12" style="min-height: 52px; padding: 6px 16px">
          <span id="rem" class="grow t-body">Remind me daily</span>
          <button type="button" role="switch" aria-checked="true" aria-labelledby="rem" class="switch on"><i></i></button>
        </div>
        <div class="hstack g12" style="min-height: 52px; padding: 6px 16px; border-top: 1px solid var(--sep)">
          <span class="grow t-body">Time</span>
          <button type="button" class="btn btn-sm btn-soft num" style="font-size: 15px">7:30 AM</button>
        </div>
      </div>
      <div class="hstack g10" style="padding: 12px 14px; border-radius: 14px; background: var(--ember-soft)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ember)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg>
        <span class="grow t-label" style="color: var(--text)">Notifications are off for BinoFit.</span>
        <button type="button" class="btn btn-sm btn-ghost" style="color: var(--ember); padding: 0 4px">Open settings</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const targets = [
      { id: 'tc', label: 'Calories', value: '500', unit: 'cal', color: 'var(--tint)' },
      { id: 'tp', label: 'Protein', value: '35', unit: 'g', color: 'var(--protein)' },
      { id: 'tcb', label: 'Carbs', value: '', unit: 'g', color: 'var(--carbs)' },
      { id: 'tf', label: 'Fat', value: '', unit: 'g', color: 'var(--fat)' }
    ].map((t, i) => ({ ...t, border: i === 0 ? 'none' : '1px solid var(--sep)' }));
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, targets };
  }
}
</script>
</body>
</html>
