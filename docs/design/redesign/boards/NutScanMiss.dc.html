<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barcode not found</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}" style="background: #121214">
  <div aria-hidden="true" style="position: absolute; left: 40px; top: 230px; width: 310px; height: 220px; border-radius: 16px; border: 4px solid rgba(255,255,255,0.35)"></div>
  <div class="scrim"></div>

  <div class="sheet" role="dialog" aria-label="Barcode not found" style="gap: 16px">
    <div class="grabber"></div>
    <div class="hstack g14">
      <span class="ico" style="width: 52px; height: 52px; border-radius: 16px; background: var(--ember-soft); color: var(--ember)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg>
      </span>
      <span class="stack grow g4">
        <span class="t-title">Not found yet</span>
        <span class="t-label muted">Open Food Facts doesn't have this product. Add it once and it's saved for next time.</span>
      </span>
    </div>
    <div class="stack g6">
      <label for="bc" class="lbl">Barcode</label>
      <input id="bc" class="field num" value="0 12345 67890 5" inputmode="numeric" style="letter-spacing: 1px">
    </div>
    <div class="stack g8">
      <a href="NutCustomFood.dc.html" class="btn btn-lg btn-primary">Create food with this barcode</a>
      <div class="hstack g8">
        <a href="NutScanner.dc.html" class="btn btn-lg btn-secondary" style="flex: 1">Scan again</a>
        <a href="NutSearch.dc.html" class="btn btn-lg btn-secondary" style="flex: 1">Search by name</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent };
  }
}
</script>
</body>
</html>
