<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll" style="padding-top: 54px">
    <div class="navbar">
      <a href="SetIndex.dc.html" class="back start" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Settings</a>
      <span></span>
      <button type="button" class="link end">Save</button>
    </div>
    <h1 class="h-large">Profile</h1>

    <div class="stack g6">
      <span class="sec">Body</span>
      <div class="list">
        <div class="row" style="min-height: 60px"><label for="w" class="grow t-body">Weight</label><input id="w" class="field mini num focus" value="172.4"><span class="t-label muted" style="width: 20px">lb</span></div>
        <div class="row" style="min-height: 60px"><span class="grow t-body">Height</span><input aria-label="Feet" class="field mini num" value="5" style="width: 52px"><span class="t-label muted">ft</span><input aria-label="Inches" class="field mini num" value="10" style="width: 52px"><span class="t-label muted">in</span></div>
      </div>
      <span class="t-cap" style="padding: 0 4px">Weight comes from your latest entry. Changing it here logs today's weight.</span>
    </div>

    <div class="stack g6">
      <span class="sec">Activity level</span>
      <div class="list" role="radiogroup" aria-label="Activity level">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{l.checked}}" class="row" style="width: 100%; border: none; border-top: {{l.border}}; background: transparent; text-align: left; color: var(--text); font-family: var(--sans)">
            <span class="stack grow g4"><span class="t-body">{{l.name}}</span><span class="t-cap">{{l.desc}}</span></span>
            <sc-if value="{{l.selected}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--tint)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if>
          </button>
        </sc-for>
      </div>
      <span class="t-cap" style="padding: 0 4px">Used for target suggestions and calories burned.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const levels = [['Sedentary', 'Desk job, little exercise'], ['Light', '1 to 2 workouts a week'], ['Moderate', '3 to 4 workouts a week'], ['Active', '5 or more workouts a week'], ['Very active', 'Physical job plus training']].map(([name, desc], i) => {
      const s = name === 'Moderate';
      return { name, desc, selected: s, checked: s ? 'true' : 'false', border: i === 0 ? 'none' : '1px solid var(--sep)' };
    });
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, levels };
  }
}
</script>
</body>
</html>
