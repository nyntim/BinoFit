<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add exercises</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="modal-under"></div>
  <div class="modal">
    <div class="modal-bar">
      <a href="TrnSession.dc.html" class="link start" style="font-weight: 400; text-decoration: none; display: inline-flex; align-items: center">Cancel</a>
      <span class="nav-title">Add exercises</span>
      <span></span>
    </div>
    <div class="stack g12" style="padding: 4px 16px 0">
      <div class="search" style="background: var(--card); border: 2px solid var(--tint); color: var(--text)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--icon)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>row</div>
    </div>
    <div class="stack g10" style="padding: 14px 16px 0">
      <div class="list">
        <sc-for list="{{items}}" as="e" hint-placeholder-count="6">
          <button type="button" role="checkbox" aria-checked="{{e.checked}}" class="row" style="width: 100%; border: none; border-top: {{e.border}}; background: {{e.bg}}; text-align: left; color: var(--text); font-family: var(--sans); min-height: 60px">
            <span class="check {{e.on}}"><sc-if value="{{e.selected}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span>
            <span class="stack grow g4"><span class="t-body">{{e.name}}</span><span class="t-cap">{{e.sub}}</span></span>
            <span class="tag">{{e.eq}}</span>
          </button>
        </sc-for>
      </div>
      <a href="TrnBuildEquip.dc.html" class="card pad-s hstack g12" style="text-decoration: none; color: var(--tint)">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
        <span class="t-body semi">Create "row"</span>
      </a>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px">
      <a href="TrnSession.dc.html" class="btn btn-lg btn-primary" style="box-shadow: 0 10px 24px rgba(14,14,16,0.2)">Add 2 exercises</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const items = [
      { name: 'Barbell row', sub: 'Lats · Traps, Biceps · last 135 × 8', eq: 'Barbell', s: 1 },
      { name: 'Seated cable row', sub: 'Lats · Biceps', eq: 'Cable', s: 1 },
      { name: 'Dumbbell row', sub: 'Lats · per side', eq: 'Dumbbell', s: 0 },
      { name: 'Row', sub: 'Cardio · distance and time', eq: 'Cardio', s: 0 },
      { name: 'Low Row · Hammer Strength', sub: 'Lats · plate-loaded', eq: 'Machine', s: 0 }
    ].map((e, i) => {
      const s = e.s === 1;
      return { ...e, selected: s, on: s ? 'on' : '', checked: s ? 'true' : 'false', bg: s ? 'var(--tint-soft)' : 'transparent', border: i === 0 ? 'none' : '1px solid var(--sep)' };
    });
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, items };
  }
}
</script>
</body>
</html>
