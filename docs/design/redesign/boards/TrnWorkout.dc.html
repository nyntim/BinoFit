<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finished workout</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}" style="height: 1100px">
  <div class="scroll" style="padding-top: 54px; padding-bottom: 48px">
    <div class="navbar">
      <a href="TrnTab.dc.html" class="back start" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Training</a>
      <span></span>
      <button type="button" class="icon-btn clear end" aria-label="More options" style="color: var(--tint)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
    </div>

    <div class="card hstack g14" style="padding: 16px 18px; background: var(--ember-soft); box-shadow: none">
      <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
        <g stroke="var(--ember)" stroke-width="2.5" stroke-linecap="round"><path d="M24 2v5M24 41v5M2 24h5M41 24h5M8.4 8.4l3.5 3.5M36.1 36.1l3.5 3.5M8.4 39.6l3.5-3.5M36.1 11.9l3.5-3.5"></path></g>
        <circle cx="24" cy="24" r="12" fill="var(--ember)"></circle>
        <path d="M18.5 24.5l4 4 7-8" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="stack grow g4"><span class="t-title" style="color: var(--ember)">Workout saved</span><span class="t-label" style="color: var(--text)">2 new records. Nice work.</span></span>
    </div>

    <div class="stack g4">
      <h1 class="h-large">Push day</h1>
      <span class="t-label muted">Fri 23 Oct · 5:12 PM · 58 min</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div class="card stack g4" style="padding: 14px"><span class="t-cap">Volume</span><span class="rnum" style="font-size: 22px">8,320</span><span class="t-cap">lb</span></div>
      <div class="card stack g4" style="padding: 14px"><span class="t-cap">Sets</span><span class="rnum" style="font-size: 22px">11</span><span class="t-cap">2 warmups</span></div>
      <div class="card stack g4" style="padding: 14px"><span class="t-cap">Burned</span><span class="rnum" style="font-size: 22px">310</span><span class="t-cap">cal</span></div>
    </div>

    <sc-for list="{{exercises}}" as="e" hint-placeholder-count="3">
      <div class="card" style="padding: 14px 0 8px">
        <div class="between" style="padding: 0 18px 6px"><span class="t-title">{{e.name}}</span><sc-if value="{{e.pr}}" hint-placeholder-val="{{false}}"><span class="tag ember-tag">{{e.prText}}</span></sc-if></div>
        <sc-for list="{{e.sets}}" as="s" hint-placeholder-count="3">
          <div class="hstack g12" style="min-height: 38px; padding: 0 18px">
            <span style="width: 22px; font-weight: 700; color: {{s.labelColor}}" class="num">{{s.label}}</span>
            <span class="grow num t-body">{{s.value}}</span>
            <sc-if value="{{s.record}}" hint-placeholder-val="{{false}}"><span class="t-cap ember semi hstack g4"><svg width="11" height="11" viewBox="0 0 24 24" fill="var(--ember)" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"></path></svg>{{s.recordText}}</span></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>

    <div class="hstack g8">
      <a href="TrnRoutine.dc.html" class="btn btn-lg btn-secondary" style="flex: 1">Save as routine</a>
      <a href="TrnLogPast.dc.html" class="btn btn-lg btn-soft" style="flex: 1">Edit</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const mk = (label, value, record, recordText) => ({ label, value, record: !!record, recordText: recordText || '', labelColor: label === 'W' ? 'var(--icon)' : 'var(--text)' });
    const exercises = [
      { name: 'Barbell bench press', pr: true, prText: 'Record', sets: [mk('W', '95 lb × 10'), mk('1', '165 lb × 8', true, 'Heaviest for 8'), mk('2', '165 lb × 8'), mk('3', '165 lb × 7')] },
      { name: 'Overhead press', pr: true, prText: 'Record', sets: [mk('W', '65 lb × 8'), mk('1', '115 lb × 8'), mk('2', '120 lb × 6', true, 'Est. 1RM 128 lb'), mk('3', '115 lb × 7')] },
      { name: 'Incline dumbbell press', pr: false, sets: [mk('1', '60 lb × 10'), mk('2', '60 lb × 9'), mk('3', '55 lb × 10')] }
    ];
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, exercises };
  }
}
</script>
</body>
</html>
