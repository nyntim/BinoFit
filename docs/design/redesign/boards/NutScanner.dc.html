<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barcode scanner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone dark {{accentClass}}" style="background: #121214">
  <div aria-hidden="true" style="position: absolute; left: 70px; top: 300px; width: 250px; height: 190px; border-radius: 16px; background: #2A2A2E; transform: rotate(-4deg)">
    <div style="position: absolute; left: 40px; top: 58px; width: 170px; height: 74px; border-radius: 6px; background: #EDEDF0; display: flex; gap: 3px; padding: 10px 14px">
      <sc-for list="{{bars}}" as="w" hint-placeholder-count="24"><span style="width: {{w}}; background: #121214"></span></sc-for>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 290px, 40px 290px, 40px 510px, 350px 510px, 350px 290px, 0 290px)"></div>
  <svg aria-hidden="true" width="310" height="220" viewBox="0 0 310 220" style="position: absolute; left: 40px; top: 290px">
    <path d="M2 40V14A12 12 0 0 1 14 2h26M270 2h26a12 12 0 0 1 12 12v26M308 180v26a12 12 0 0 1-12 12h-26M40 218H14A12 12 0 0 1 2 206v-26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path>
    <rect x="24" y="108" width="262" height="3" rx="1.5" fill="var(--tint)"></rect>
  </svg>

  <div class="between" style="position: absolute; top: 58px; left: 16px; right: 16px">
    <a href="NutSearch.dc.html" class="icon-btn" aria-label="Cancel" style="background: rgba(255,255,255,0.14); color: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span class="t-title" style="color: #FFFFFF">Scan barcode</span>
    <button type="button" class="icon-btn" aria-label="Turn on flashlight" aria-pressed="false" style="background: rgba(255,255,255,0.14); color: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2h10l-2 6v12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8z"></path><path d="M12 12v3"></path></svg>
    </button>
  </div>

  <div class="stack g12 center" style="position: absolute; left: 20px; right: 20px; bottom: 40px">
    <span class="t-body" style="color: #FFFFFF; font-size: 17px; font-weight: 600">Point the camera at a barcode</span>
    <span class="t-label" style="color: rgba(255,255,255,0.7)">Products come from Open Food Facts</span>
    <div class="hstack g8" style="width: 100%; margin-top: 8px">
      <a href="NutScanMiss.dc.html" class="btn btn-lg" style="flex: 1; background: rgba(255,255,255,0.14); color: #FFFFFF">Enter digits</a>
      <a href="NutSearch.dc.html" class="btn btn-lg" style="flex: 1; background: #FFFFFF; color: #121214">Search by name</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent || 'Indigo';
    const bars = [2, 4, 2, 2, 6, 2, 4, 2, 2, 4, 6, 2, 2, 4, 2, 6, 2, 2, 4, 2, 6, 2, 4, 2].map((n) => n + 'px');
    return { accentClass: accent.toLowerCase(), bars };
  }
}
</script>
</body>
</html>
