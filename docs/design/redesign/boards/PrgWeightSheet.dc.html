<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log weight</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll" aria-hidden="true">
    <h1 class="h-large">Progress</h1>
    <div class="seg" style="grid-template-columns: repeat(4, minmax(0, 1fr))"><button type="button">7D</button><button type="button" class="on">30D</button><button type="button">90D</button><button type="button">All</button></div>
    <div class="card" style="height: 220px"></div>
    <div class="card" style="height: 160px"></div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" role="dialog" aria-label="Log weight" style="gap: 18px">
    <div class="grabber"></div>
    <div class="between">
      <a href="PrgMain.dc.html" class="link" style="font-weight: 400; text-decoration: none; display: inline-flex; align-items: center">Cancel</a>
      <span class="t-title">Log weight</span>
      <a href="PrgMain.dc.html" class="link" style="text-decoration: none; display: inline-flex; align-items: center">Save</a>
    </div>
    <div class="hstack g12" style="justify-content: center">
      <button type="button" class="icon-btn" aria-label="Decrease by 0.1" style="width: 52px; height: 52px; border-radius: 26px; font-size: 22px">−</button>
      <label class="stack center" style="min-width: 170px"><span style="position: absolute; left: -9999px">Weight in pounds</span><input value="172.4" inputmode="decimal" class="num" style="width: 170px; border: none; background: transparent; text-align: center; color: var(--text); font: 800 60px/1 var(--round); letter-spacing: -1px"><span class="t-body muted">lb</span></label>
      <button type="button" class="icon-btn" aria-label="Increase by 0.1" style="width: 52px; height: 52px; border-radius: 26px; font-size: 22px">+</button>
    </div>
    <span class="t-cap" style="text-align: center">Last entry 172.8 lb on Wed 21 Oct</span>
    <div class="nested" style="overflow: hidden">
      <div class="hstack g12" style="min-height: 52px; padding: 6px 16px"><span class="grow t-body">Date</span><button type="button" class="btn btn-sm" style="background: var(--card); color: var(--tint); font-size: 15px">Today</button></div>
      <div class="hstack g12" style="min-height: 52px; padding: 6px 16px; border-top: 1px solid var(--sep)"><span class="grow t-body">Time</span><button type="button" class="btn btn-sm num" style="background: var(--card); color: var(--tint); font-size: 15px">7:05 AM</button></div>
    </div>
    <div class="hstack g10" style="padding: 12px 14px; border-radius: 14px; background: var(--tint-soft)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--protein)" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.1 3.2 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.6 0 5.8 3.6 4.3 7.2C19.5 16.4 12 21 12 21z"></path></svg>
      <span class="grow t-label" style="color: var(--text)">Apple Health readings import on their own. A weight you log here wins for that day.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent };
  }
}
</script>
</body>
</html>
