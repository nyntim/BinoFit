<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add water</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll" aria-hidden="true">
    <h1 class="h-large">Today</h1>
    <div class="card" style="height: 90px"></div>
    <div class="card" style="height: 176px"></div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" role="dialog" aria-label="Add a drink">
    <div class="grabber"></div>
    <div class="between">
      <a href="NutDashboard.dc.html" class="link" style="font-weight: 400; text-decoration: none; display: inline-flex; align-items: center">Cancel</a>
      <span class="t-title">Add a drink</span>
      <a href="NutDashboard.dc.html" class="link" style="text-decoration: none; display: inline-flex; align-items: center">Add</a>
    </div>

    <div class="stack g4 center" style="padding: 6px 0">
      <span class="rnum" style="font-size: 52px">500<span class="t-title muted" style="font-family: var(--sans)"> ml</span></span>
      <span class="t-cap num">Today 1.25 L, 1.75 L after this</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px" role="radiogroup" aria-label="Amount">
      <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{s.checked}}" style="height: 84px; border-radius: 16px; border: {{s.border}}; background: {{s.bg}}; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: var(--sans)">
          <svg width="22" height="{{s.h}}" viewBox="0 0 22 32" fill="none" stroke="var(--fat)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h16l-2 26H5z"></path><path d="M4.5 14h13l-1.2 15H5.7z" fill="var(--fat)" fill-opacity="0.35" stroke="none"></path></svg>
          <span class="t-label semi num">{{s.label}}</span>
        </button>
      </sc-for>
    </div>

    <div class="stack g8">
      <span class="sec">Other drinks</span>
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search drinks, like coffee</div>
      <div class="nested" style="overflow: hidden">
        <div class="hstack g12" style="min-height: 48px; padding: 6px 14px"><span class="grow t-body">Coffee, black</span><span class="t-cap num">240 ml · 2 cal</span></div>
        <div class="hstack g12" style="min-height: 48px; padding: 6px 14px; border-top: 1px solid var(--sep)"><span class="grow t-body">Sparkling water</span><span class="t-cap num">330 ml · 0 cal</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const sizes = [['250 ml', 22], ['330 ml', 26], ['500 ml', 30], ['750 ml', 32]].map(([label, h]) => {
      const on = label === '500 ml';
      return { label, h, checked: on ? 'true' : 'false', bg: on ? 'var(--tint-soft)' : 'var(--card2)', border: on ? '2px solid var(--tint)' : '2px solid transparent' };
    });
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, sizes };
  }
}
</script>
</body>
</html>
