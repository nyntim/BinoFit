<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="stack" style="position: absolute; inset: 0; padding: 54px 20px 40px; gap: 22px">
    <div class="between">
      <a href="OnbWelcome.dc.html" class="back" style="text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Back
      </a>
      <div role="progressbar" aria-label="Step 1 of 3" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3" class="hstack g4" style="width: 120px">
        <span style="flex: 1; height: 4px; border-radius: 2px; background: var(--tint)"></span>
        <span style="flex: 1; height: 4px; border-radius: 2px; background: var(--track)"></span>
        <span style="flex: 1; height: 4px; border-radius: 2px; background: var(--track)"></span>
      </div>
    </div>

    <div class="stack g8">
      <h1 class="h-xl">Back up your log</h1>
      <p class="t-body muted" style="margin: 0">Your data lives on this phone either way. An account keeps a copy safe and moves it to a new phone.</p>
    </div>

    <div class="stack g14">
      <div class="stack g6">
        <label for="em" class="lbl">Email</label>
        <input id="em" class="field focus" value="sam@example.com" type="email" autocomplete="email">
      </div>
      <div class="stack g6">
        <label for="pw" class="lbl">Password</label>
        <div style="position: relative">
          <input id="pw" class="field" value="••••••••••" type="text" autocomplete="new-password" style="padding-right: 56px">
          <button type="button" aria-label="Show password" class="icon-btn clear" style="position: absolute; right: 2px; top: 2px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <span class="t-cap">At least 8 characters.</span>
      </div>
    </div>

    <a href="OnbStats.dc.html" class="btn btn-lg btn-primary">Create account</a>

    <div class="hstack g12"><span class="sep grow"></span><span class="t-cap">or</span><span class="sep grow"></span></div>

    <button type="button" class="btn btn-lg btn-ink">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"></path></svg>
      Continue with Apple
    </button>

    <div class="spacer"></div>
    <p class="t-cap" style="margin: 0; text-align: center">By continuing you agree to the <a href="SetLegal.dc.html" class="tint" style="text-decoration: none">Terms</a> and <a href="SetLegal.dc.html" class="tint" style="text-decoration: none">Privacy Policy</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent };
  }
}
</script>
</body>
</html>
