<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serving picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}" style="height: 1040px">
  <div class="modal-under"></div>
  <div class="modal">
    <div class="modal-bar">
      <a href="NutSearch.dc.html" class="back start" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Search</a>
      <span class="nav-title">Meal 2</span>
      <a href="NutDashboard.dc.html" class="btn btn-primary btn-sm end" style="min-height: 40px; padding: 0 18px; font-size: 15px">Log</a>
    </div>
    <div class="scroll">
      <div class="stack g4">
        <h1 class="h-xl" style="font-size: 26px">Greek yogurt, plain, 2%</h1>
        <span class="hstack g6"><span class="tag">USDA</span><span class="t-cap">Generic · SR Legacy</span></span>
      </div>

      <div class="card pad stack g14">
        <div class="between">
          <label for="amt" class="lbl">Amount</label>
          <div class="stepper"><button type="button" aria-label="Less">−</button><span><input id="amt" value="1.5" style="width: 52px; border: none; background: transparent; text-align: center; font: 800 20px var(--round); color: var(--text)"></span><button type="button" aria-label="More">+</button></div>
        </div>
        <div class="chips" role="radiogroup" aria-label="Serving size" style="flex-wrap: wrap">
          <button type="button" role="radio" aria-checked="true" class="chip on">cup (245 g)</button>
          <button type="button" role="radio" aria-checked="false" class="chip">container (170 g)</button>
          <button type="button" role="radio" aria-checked="false" class="chip">g</button>
          <button type="button" role="radio" aria-checked="false" class="chip">oz</button>
        </div>
        <div class="sep"></div>
        <div class="between"><span class="t-body">Time</span><button type="button" class="btn btn-sm btn-soft num" style="font-size: 15px">12:40 PM</button></div>
        <div class="between">
          <span class="t-body">Status</span>
          <div class="seg" style="grid-template-columns: repeat(2, 88px)" role="radiogroup" aria-label="Status">
            <button type="button" role="radio" aria-checked="true" class="on">Eaten</button>
            <button type="button" role="radio" aria-checked="false">Planned</button>
          </div>
        </div>
      </div>

      <div class="card pad stack g14">
        <div class="hstack" style="gap: 16px">
          <div role="img" aria-label="270 calories: protein 34 percent, carbs 20 percent, fat 46 percent" style="position: relative; width: 96px; height: 96px; flex-shrink: 0">
            <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true" style="transform: rotate(-90deg)">
              <circle cx="48" cy="48" r="40" fill="none" stroke="var(--protein)" stroke-width="10" stroke-dasharray="83.4 251.3"></circle>
              <circle cx="48" cy="48" r="40" fill="none" stroke="var(--carbs)" stroke-width="10" stroke-dasharray="48.3 251.3" stroke-dashoffset="-87.4"></circle>
              <circle cx="48" cy="48" r="40" fill="none" stroke="var(--fat)" stroke-width="10" stroke-dasharray="107.6 251.3" stroke-dashoffset="-139.7"></circle>
            </svg>
            <div class="stack center" style="position: absolute; inset: 0; justify-content: center"><span class="rnum" style="font-size: 24px">270</span><span class="t-cap">cal</span></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex-grow: 1">
            <div class="nested stack center g4" style="padding: 10px 4px"><span class="dot" style="width: 8px; height: 8px; background: var(--protein)"></span><span class="semi num">23.4 g</span><span class="t-cap">Protein</span></div>
            <div class="nested stack center g4" style="padding: 10px 4px"><span class="dot" style="width: 8px; height: 8px; background: var(--carbs)"></span><span class="semi num">14.4 g</span><span class="t-cap">Carbs</span></div>
            <div class="nested stack center g4" style="padding: 10px 4px"><span class="dot" style="width: 8px; height: 8px; background: var(--fat)"></span><span class="semi num">13.6 g</span><span class="t-cap">Fat</span></div>
          </div>
        </div>
        <span class="t-cap num">Per 100 g: 73 cal · P 6.4 · C 3.9 · F 3.7</span>
      </div>

      <div class="card pad stack g12">
        <div class="between"><span class="t-title">Your day with this</span><span class="t-cap">Pale = this food</span></div>
        <sc-for list="{{targets}}" as="t" hint-placeholder-count="4">
          <div class="stack g6">
            <div class="between t-label"><span>{{t.label}}</span><span class="num"><span class="bold">{{t.after}}</span><span class="muted"> / {{t.goal}}</span></span></div>
            <div class="bar" style="display: flex"><i style="width: {{t.now}}; background: {{t.color}}; border-radius: 4px 0 0 4px"></i><i style="width: {{t.add}}; background: {{t.color}}; opacity: 0.38; border-radius: 0 4px 4px 0"></i></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const targets = [
      { label: 'Calories', after: '1,370', goal: '2,250 cal', now: '49%', add: '12%', color: 'var(--tint)' },
      { label: 'Protein', after: '103', goal: '169 g', now: '47%', add: '14%', color: 'var(--protein)' },
      { label: 'Carbs', after: '140', goal: '253 g', now: '50%', add: '5%', color: 'var(--carbs)' },
      { label: 'Fat', after: '43', goal: '63 g', now: '46%', add: '22%', color: 'var(--fat)' }
    ];
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, targets };
  }
}
</script>
</body>
</html>
