<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="stack" style="position: absolute; inset: 0; padding: 96px 20px 40px; gap: 24px">
    <div class="stack g14 center">
      <div style="position: relative; width: 104px; height: 104px">

        <span style="position: absolute; right: 0; bottom: 6px; width: 34px; height: 34px; border-radius: 17px; background: var(--tint); color: var(--on-tint); border: 3px solid var(--bg); display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>
        </span>
      </div>
      <h1 class="h-xl">Welcome back</h1>
      <p class="t-body muted" style="margin: 0; max-width: 300px">We found a backup for sam@example.com. Bring it onto this phone?</p>
    </div>

    <div class="list">
      <div class="row"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.2 0-4 2.7-4 7s1.8 5 4 5"></path></svg></span><span class="grow t-body">Food logs</span><span class="semi num">214 days</span></div>
      <div class="row"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg></span><span class="grow t-body">Workouts and routines</span><span class="semi num">86 · 3</span></div>
      <div class="row"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8"></path></svg></span><span class="grow t-body">Weight entries</span><span class="semi num">41</span></div>
      <div class="row"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span class="grow t-body">Last backup</span><span class="semi">Wed 21 Oct</span></div>
    </div>

    <div class="spacer"></div>
    <div class="stack g10">
      <a href="NutDashboard.dc.html" class="btn btn-lg btn-primary">Restore data</a>
      <a href="OnbStats.dc.html" class="btn btn-lg btn-ghost">Start fresh on this phone</a>
      <p class="t-cap" style="margin: 0; text-align: center">Starting fresh keeps your backup in your account.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent };
  }
}
</script>
</body>
</html>
