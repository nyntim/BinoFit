<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit weight entry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll" style="padding-top: 54px">
    <div class="navbar">
      <a href="PrgMain.dc.html" class="back start" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Progress</a>
      <span></span><span></span>
    </div>
    <h1 class="h-large">Weight</h1>
    <div class="list">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="6">
        <div class="row" style="min-height: 58px; background: {{e.bg}}">
          <span class="stack grow g4"><span class="t-body semi">{{e.date}}</span><span class="t-cap">{{e.src}}</span></span>
          <span class="rnum" style="font-size: 18px">{{e.v}}<span class="t-cap" style="font-family: var(--sans); font-weight: 400"> kg</span></span>
        </div>
      </sc-for>
    </div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" role="dialog" aria-label="Edit weight entry" style="gap: 16px">
    <div class="grabber"></div>
    <div class="between">
      <a href="PrgMain.dc.html" class="link" style="font-weight: 400; text-decoration: none; display: inline-flex; align-items: center">Cancel</a>
      <span class="t-title">Wed 21 Oct</span>
      <a href="PrgMain.dc.html" class="link" style="text-decoration: none; display: inline-flex; align-items: center">Save</a>
    </div>
    <label class="stack center g4"><span style="position: absolute; left: -9999px">Weight in kilograms</span><input value="78.4" inputmode="decimal" class="num" style="width: 200px; border: none; border-bottom: 2px solid var(--tint); background: transparent; text-align: center; color: var(--text); font: 800 56px/1.1 var(--round)"><span class="t-body muted">kg · logged at 7:12 AM</span></label>
    <button type="button" class="btn btn-lg btn-danger" style="background: var(--danger-soft)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete entry
    </button>
    <span class="t-cap" style="text-align: center">Your profile weight follows the latest entry.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true; const accent = this.props.accent || 'Indigo';
    const entries = [
      { date: 'Fri 23 Oct', src: 'Apple Health', v: '78.2' },
      { date: 'Wed 21 Oct', src: 'Logged', v: '78.4', sel: true },
      { date: 'Mon 19 Oct', src: 'Logged', v: '78.6' },
      { date: 'Sat 17 Oct', src: 'Apple Health', v: '78.5' },
      { date: 'Thu 15 Oct', src: 'Logged', v: '78.9' }
    ].map((e) => ({ ...e, bg: e.sel ? 'var(--tint-soft)' : 'transparent' }));
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, entries };
  }
}
</script>
</body>
</html>
