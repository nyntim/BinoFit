<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to BinoFit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div aria-hidden="true" style="position: absolute; top: -120px; left: -80px; width: 560px; height: 560px; border-radius: 280px; background: var(--ember-soft); opacity: 0.7"></div>
  <div aria-hidden="true" style="position: absolute; top: 140px; right: -140px; width: 320px; height: 320px; border-radius: 160px; background: var(--tint-soft)"></div>

  <div class="stack" style="position: absolute; inset: 0; padding: 96px 24px 40px; gap: 28px">
    <img src="/_blob/2e9acac9534fc515aaef20e5d777951d" alt="BinoFit dinosaur" style="width: 132px; height: 132px; margin-left: -10px">
    <div class="stack g12">
      <h1 style="margin: 0; font: 800 40px/1.08 var(--round); letter-spacing: -0.8px">Eat, train and watch it add up.</h1>
      <p class="t-body muted" style="margin: 0; font-size: 17px">Log a meal in seconds, run your workouts and see the weeks take shape. No account needed to start.</p>
    </div>
    <div class="hstack g8" style="flex-wrap: wrap">
      <span class="chip" style="background: var(--card)"><span class="dot" style="background: var(--protein)"></span>Nutrition</span>
      <span class="chip" style="background: var(--card)"><span class="dot" style="background: var(--tint)"></span>Training</span>
      <span class="chip" style="background: var(--card)"><span class="dot" style="background: var(--ember)"></span>Progress</span>
    </div>
    <div class="spacer"></div>
    <div class="stack g10">
      <button type="button" class="btn btn-lg btn-ink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4z"></path></svg>
        Sign up with Apple
      </button>
      <a href="OnbAccount.dc.html" class="btn btn-lg btn-secondary" style="background: var(--card)">Sign up with email</a>
      <a href="OnbStats.dc.html" class="btn btn-lg btn-ghost">Continue without an account</a>
      <p class="t-label muted" style="margin: 4px 0 0; text-align: center">Already have an account? <a href="SetSignIn.dc.html" class="tint semi" style="text-decoration: none">Sign in</a></p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent };
  }
}
</script>
</body>
</html>
