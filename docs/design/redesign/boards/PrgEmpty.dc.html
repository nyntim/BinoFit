<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress, nothing logged yet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll">
    <h1 class="h-large">Progress</h1>
    <div class="card stack g16 center" style="padding: 32px 24px">
      <img src="/_blob/2e9acac9534fc515aaef20e5d777951d" alt="" style="width: 112px; height: 112px">
      <div class="stack g8 center">
        <span class="h-xl" style="font-size: 24px">Your trends start here</span>
        <span class="t-body muted">Log a few days of food or a workout and this page fills in. Weekly patterns show after 7 days.</span>
      </div>
      <div class="stack g8" style="width: 100%">
        <a href="NutSearch.dc.html" class="btn btn-lg btn-primary">Log food</a>
        <a href="TrnSession.dc.html" class="btn btn-lg btn-secondary">Start a workout</a>
      </div>
    </div>
    <div class="card pad stack g12" aria-hidden="true" style="opacity: 0.55">
      <span class="t-label muted semi">Calories, daily average</span>
      <div style="height: 80px; display: flex; align-items: flex-end; gap: 6px">
        <sc-for list="{{ghost}}" as="h" hint-placeholder-count="7"><div style="flex: 1; height: {{h}}; border-radius: 4px; background: var(--track)"></div></sc-for>
      </div>
      <span class="t-cap">No average yet</span>
    </div>
  </div>
  <div class="tabwrap"><dc-import name="CmpTabBar" active="progress" workout="{{no}}" dark="{{dark}}" accent="{{accent}}" hint-size="342px,128px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const ghost = ['40px', '58px', '34px', '66px', '50px', '44px', '62px'];
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, no: false, ghost };
  }
}
</script>
</body>
</html>
