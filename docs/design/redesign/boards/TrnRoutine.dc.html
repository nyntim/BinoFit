<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Routine</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="th phone {{theme}}">
  <div class="scroll" style="padding-top: 54px; padding-bottom: 170px">
    <div class="navbar">
      <a href="TrnTab.dc.html" class="back start" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Training</a>
      <span class="nav-title">Routine</span>
      <button type="button" class="icon-btn clear end" aria-label="More options" style="color: var(--tint)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
    </div>
    <div class="stack g6">
      <label for="rn" class="lbl">Name</label>
      <input id="rn" class="field" value="Push day" style="height: 56px; font: 800 24px var(--round)">
    </div>
    <div class="between" style="padding: 0 4px"><span class="sec" style="padding: 0">Exercises</span><span class="t-cap">About 60 min</span></div>
    <div class="list">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div class="hstack g8" style="min-height: 64px; padding: 6px 8px 6px 4px; border-top: {{r.border}}">
          <button type="button" class="icon-btn clear" aria-label="Reorder {{r.name}}" style="width: 36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
          <span class="stack grow g4"><span class="t-body semi">{{r.name}}</span><span class="t-cap num">{{r.sets}}</span></span>
          <button type="button" class="btn btn-sm btn-soft num" aria-label="Rest for {{r.name}}, {{r.rest}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{r.rest}}</button>
        </div>
      </sc-for>
    </div>
    <a href="TrnPicker.dc.html" class="btn btn-lg btn-secondary" style="border-style: dashed">+ Add exercises</a>
  </div>
  <div class="stack g8" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 34px; background: var(--card); border-top: 1px solid var(--sep)">
    <a href="TrnSession.dc.html" class="btn btn-lg btn-primary">Start workout</a>
    <a href="TrnLogPast.dc.html" class="btn btn-lg btn-ghost" style="min-height: 44px">Log past workout</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["Indigo","Plum","Pine"],"default":"Indigo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark; const accent = this.props.accent || 'Indigo';
    const rows = [
      { name: 'Barbell bench press', sets: '1 warmup + 3 sets', rest: '2:00' },
      { name: 'Overhead press', sets: '1 warmup + 3 sets', rest: '2:00' },
      { name: 'Incline dumbbell press', sets: '3 sets', rest: '1:30' },
      { name: 'Lateral raise', sets: '3 sets', rest: '1:00' },
      { name: 'Triceps pushdown', sets: '3 sets', rest: 'No rest' }
    ].map((r, i) => ({ ...r, border: i === 0 ? 'none' : '1px solid var(--sep)' }));
    return { theme: (dark ? 'dark ' : '') + accent.toLowerCase(), dark, accent, rows };
  }
}
</script>
</body>
</html>
